# Build one manual (and optionally deploy it). Called by build.yml and upstream.yml.
name: build package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      ref:
        description: "upstream commit to build (default: the one in upstream.lock)"
        required: false
        type: string
        default: ""
      deploy:
        required: false
        type: boolean
        default: false
    outputs:
      commit:
        description: the upstream commit that was built
        value: ${{ jobs.build.outputs.commit }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # TeX Live updated weekly; the manuals track current upstream code, which
    # often needs a recent LaTeX kernel. Replace by a TLxxxx-historic tag to freeze.
    container: texlive/texlive:latest
    outputs:
      commit: ${{ steps.fetch.outputs.commit }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git python3-pip python3-venv mupdf-tools poppler-utils ghostscript \
            imagemagick pngquant librsvg2-bin nodejs npm lftp gnuplot-nox
          npm install -g svgo prettier
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install -q beautifulsoup4 html5lib lxml requests numpy pillow "pypdf>=6,<7"
          echo /opt/venv/bin >> "$GITHUB_PATH"

      - name: Test build helpers
        if: inputs.package != 'tcolorbox'
        run: python3 -m unittest discover -s tests -v

      - name: Show FTP folders
        if: inputs.deploy
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_USER: ${{ vars.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: scripts/deploy.sh --list || echo "::warning::FTP listing failed"

      - name: Restore source archive cache
        if: inputs.package == 'wheelchart'
        uses: actions/cache@v4
        with:
          path: .upstream/archive-cache
          key: source-archives-v1-${{ hashFiles('wheelchart/upstream.json') }}

      - name: Fetch upstream
        id: fetch
        run: |
          git config --global --add safe.directory '*'
          scripts/fetch.sh "${{ inputs.package }}" ${{ inputs.ref }}
          if [[ -f .upstream/${{ inputs.package }}/.source-ref ]]; then
            echo "commit=$(cat .upstream/${{ inputs.package }}/.source-ref)" >> "$GITHUB_OUTPUT"
          else
            echo "commit=$(git -C .upstream/${{ inputs.package }} rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore illustration cache
        if: inputs.package != 'tcolorbox'
        uses: actions/cache@v4
        with:
          path: build/image-cache
          key: illustrations-v1-${{ runner.os }}-${{ inputs.package }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            illustrations-v1-${{ runner.os }}-${{ inputs.package }}-

      - name: Build
        run: scripts/build.sh "${{ inputs.package }}"

      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ inputs.package }}
          path: build/${{ inputs.package }}/site
          retention-days: 30

      - name: Deploy
        if: inputs.deploy
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_USER: ${{ vars.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_ROOT: ${{ vars.FTP_ROOT }}
          DEPLOY_PREFIX: ${{ vars.DEPLOY_PREFIX }}
        run: scripts/deploy.sh "${{ inputs.package }}"
