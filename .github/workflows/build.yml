# On pushes to main: rebuild and deploy the manuals whose files changed, from
# the upstream commit pinned in their upstream.lock. Also runnable by hand.
name: build

on:
  push:
    # monorepo: test branch, deploys below DEPLOY_PREFIX (remove after the switch)
    branches: [main, monorepo]
    paths: [pgf/**, pgfplots/**, tcolorbox/**, tikz-cd/**, pgf-pie/**, tikz-feynman/**, shared/**, scripts/**, .github/workflows/build*.yml]
  workflow_dispatch:
    inputs:
      package:
        description: package to build (empty = all)
        required: false
        default: ""
      deploy:
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        run: |
          all=$(printf '%s\n' */upstream.lock | cut -d/ -f1 | jq -R . | jq -sc .)
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            p="${{ inputs.package }}"
            [[ -z $p ]] && echo "packages=$all" >> "$GITHUB_OUTPUT" || echo "packages=[\"$p\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || echo shared/)
          if grep -qE '^(shared|scripts|\.github)/' <<< "$changed"; then
            echo "packages=$all" >> "$GITHUB_OUTPUT"
          else
            packages=$(cut -d/ -f1 <<< "$changed" | sort -u | while read -r pkg; do
              if [[ -f $pkg/upstream.lock ]]; then echo "$pkg"; fi
            done | jq -R . | jq -sc .)
            echo "packages=$packages" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    uses: ./.github/workflows/build-package.yml
    with:
      package: ${{ matrix.package }}
      deploy: ${{ github.event_name == 'push' || inputs.deploy == true }}
    secrets: inherit
