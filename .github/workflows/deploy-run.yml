# Deploy the sites built by an earlier run of build.yml without rebuilding
# (e.g. after a failed upload). Set RUN_ID below and push this file, or run it
# by hand. With RUN_ID empty it only lists the folders on the FTP server.
name: deploy run

on:
  push:
    branches: [main, monorepo]
    paths: [.github/workflows/deploy-run.yml]
  workflow_dispatch:
    inputs:
      run_id:
        description: run of build.yml whose site-* artifacts to deploy
        required: true

env:
  RUN_ID: ${{ inputs.run_id || '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      FTP_HOST: ${{ vars.FTP_HOST }}
      FTP_USER: ${{ vars.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_ROOT: ${{ vars.FTP_ROOT }}
      DEPLOY_PREFIX: ${{ vars.DEPLOY_PREFIX }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq lftp
      - name: List FTP folders
        run: scripts/deploy.sh --list
      - name: Deploy artifacts
        if: env.RUN_ID != ''
        run: |
          for pkg in pgf pgfplots tcolorbox; do
            if gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "site-$pkg" -D "build/$pkg/site"; then
              scripts/deploy.sh "$pkg"
            else
              echo "::warning::no site-$pkg artifact in run $RUN_ID"
            fi
          done
