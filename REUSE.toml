version = 1

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2021-2026 Dominik Peters"
SPDX-License-Identifier = "MIT"

# pgf documentation (doc/ of pgf-tikz/pgf): GNU FDL 1.2 or LPPL 1.3c
[[annotations]]
path = [
  "pgf/patches/**",
  "pgf/standalone/**",
  "pgf/spotlight-tocs/**",
  "shared/pgfmanual/pgfmanual.sty",
  "shared/pgfmanual/pgfmanual.code.tex",
  "shared/pgfmanual/pgfmanual.pdflinks.code.tex",
  "shared/pgfmanual/pgfmanual.prettyprinter.code.tex",
  "shared/pgfmanual/pgfmanual-en-macros.tex",
  "tikz-cd/tikz-cd-html.sty",
  "pgf/brave-gnu-world-logo.eps",
]
precedence = "override"
SPDX-FileCopyrightText = "Till Tantau and the PGF/TikZ team; changes 2021-2026 Dominik Peters"
SPDX-License-Identifier = "GFDL-1.2-only OR LPPL-1.3c"

# pgfplots documentation: GPL 3 or later
[[annotations]]
path = ["pgfplots/patches/**", "pgfplots/pgfplotsoldpgfsupp_*.code.tex"]
precedence = "override"
SPDX-FileCopyrightText = "Christian Feuersänger and the pgfplots team; changes 2022-2026 Dominik Peters"
SPDX-License-Identifier = "GPL-3.0-or-later"

# adapted from the tcolorbox documentation library
[[annotations]]
path = "tcolorbox/tcbhtml.sty"
precedence = "override"
SPDX-FileCopyrightText = "Thomas F. Sturm; changes 2026 Dominik Peters"
SPDX-License-Identifier = "LPPL-1.3c+"

# tikz-cd documentation: LPPL 1.3c or later
[[annotations]]
path = "tikz-cd/patches/**"
precedence = "override"
SPDX-FileCopyrightText = "2011-2021 Augusto Stoffel; changes 2026 Dominik Peters"
SPDX-License-Identifier = "LPPL-1.3c+"
